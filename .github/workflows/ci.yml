name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare WXT types
        run: pnpm run compile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Svelte Check
        run: pnpm run check

      - name: Run Tests
        run: pnpm run test

  build:
    name: Build (${{ matrix.browser }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare WXT types
        run: pnpm run compile

      - name: Build Extension (${{ matrix.browser }})
        run: pnpm wxt build -b ${{ matrix.browser }}

      - name: Package Extension (${{ matrix.browser }})
        run: |
          pnpm wxt zip -b ${{ matrix.browser }}
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            node scripts/pack.js crx
          elif [ "${{ matrix.browser }}" = "firefox" ]; then
            node scripts/pack.js xpi
          fi

      - name: Upload Artifact (${{ matrix.browser }})
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.browser }}
          path: |
            .output/*.zip
            .output/*.crx
            .output/*.xpi
          retention-days: 7
