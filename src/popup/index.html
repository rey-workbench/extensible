<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extensible</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Extensity App Shell -->
  <div class="ext-shell">
    <!-- Top Header Bar -->
    <header class="ext-header">
      <div class="ext-brand">
        <div class="ext-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect width="24" height="24" rx="6" fill="#0f172a"/>
            <path d="M4.5 12h6.5a3.2 3.2 0 10-1 2.4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13.5 9l5.5 6M13.5 15l5.5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="ext-title">Extensible</h1>
      </div>

      <!-- Quick Action Icons Toolbar -->
      <div class="ext-actions">
        <label class="ext-switch" for="masterToggle" title="Toggle all extensions">
          <input type="checkbox" id="masterToggle" title="Toggle all extensions" aria-label="Toggle all extensions" checked>
          <span class="ext-slider"></span>
        </label>
        <button type="button" class="ext-icon-btn" id="btnExtensions" title="Extensions">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 00-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 000-5z"/></svg>
        </button>
        <button type="button" class="ext-icon-btn" id="btnProfile" title="Profiles">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </button>
        <button type="button" class="ext-icon-btn" id="btnSettings" title="Options">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
        <button type="button" class="ext-icon-btn ext-social-btn" id="btnTwitter" title="Twitter">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.05c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 01-1.93.07 4.28 4.28 0 004 2.98 8.521 8.521 0 01-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/></svg>
        </button>
        <button type="button" class="ext-icon-btn ext-social-btn" id="btnFacebook" title="Facebook">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h7v-7h-2v-3h2V8.5C12 6.57 13.57 5 15.5 5H18v3h-1.5C15.67 8 15 8.67 15 9.5V11h3l-.5 3H15v7h4c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        </button>
        <button type="button" class="ext-icon-btn ext-star-btn" id="btnStar" title="Bookmark / Rating">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
      </div>
    </header>

    <!-- Inset Search Input -->
    <div class="ext-search-bar">
      <span class="ext-search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </span>
      <input type="text" id="extSearchInput" class="ext-search-input" placeholder="Search extensions..." autocomplete="off" spellcheck="false">
      <button type="button" id="extClearSearch" class="ext-clear-btn" title="Clear search" aria-label="Clear search">&times;</button>
    </div>

    <!-- Main View 1: Extensity List View -->
    <div id="extListView" class="ext-view active">
      <div class="ext-section-header">
        <span>Extensions</span>
      </div>
      <div id="moduleList" class="ext-list" role="list">
        <!-- Module Rows Rendered Dynamically -->
      </div>
    </div>

    <!-- Main View 2: Module Detail View (e.g. TempMail Dashboard) -->
    <div id="extDetailView" class="ext-view">
      <div class="ext-nav-bar">
        <button type="button" id="backToListBtn" class="ext-back-btn">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          <span>Back to Extensions</span>
        </button>
        <span id="detailTitle" class="ext-detail-title">Extension</span>
      </div>
      <main class="ext-mount-container" id="moduleMount">
        <!-- Module Views Mounted Here -->
      </main>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
